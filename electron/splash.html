<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GitHub Explorer V2 啟動中...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #080c14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }
    .container {
      text-align: center;
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .radar-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #9333ea);
      border-radius: 18px;
      padding: 2px;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
      margin-bottom: 16px;
      animation: pulse 2s infinite ease-in-out;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-family: monospace;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      padding: 2px 6px;
      margin-left: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: 500;
      max-width: 380px;
      word-break: break-word;
      line-height: 1.4;
    }
    .progress-bar-bg {
      width: 260px;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      border-radius: 2px;
      position: absolute;
      animation: indeterminate 1.5s infinite ease-in-out;
    }
    .error-box {
      display: none;
      margin-top: 10px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .log-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .log-btn:hover {
      background: #334155;
      color: #f8fafc;
      border-color: #475569;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 32px rgba(6, 182, 212, 0.5); }
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="radar-box">
      <img id="appIcon" src="../build/icon.png" onerror="this.onerror=null; this.src='../public/icon.png';" alt="Logo" style="width: 100%; height: 100%; border-radius: 16px; object-fit: cover;" />
    </div>
    <div class="title">
      開源專案雷達<span class="badge">V2 桌面版</span>
    </div>
    <div class="subtitle">Discover What's Rising in Open Source</div>
    <div class="status-text" id="statusMsg">正在啟動本機服務引擎...</div>
    <div class="progress-bar-bg" id="progressContainer">
      <div class="progress-bar"></div>
    </div>
    <div class="error-box" id="errorBox">
      <button class="log-btn" id="openLogBtn" onclick="handleOpenLog()">檢視詳細診斷記錄檔</button>
    </div>
  </div>

  <script>
    let isErrorState = false;

    function updateStatusText(text) {
      if (isErrorState) return;
      const msgEl = document.getElementById('statusMsg');
      if (msgEl && text) {
        msgEl.innerText = text;
      }
    }

    function showStartupError(errorMessage, logPath) {
      isErrorState = true;
      const msgEl = document.getElementById('statusMsg');
      const progress = document.getElementById('progressContainer');
      const errorBox = document.getElementById('errorBox');
      
      if (progress) progress.style.display = 'none';
      if (errorBox) errorBox.style.display = 'flex';

      if (msgEl) {
        msgEl.innerHTML = '<span style="color:#ef4444; font-weight:600;">啟動本機服務失敗</span><br/><span style="color:#94a3b8; font-size:11px;">' + (errorMessage || '伺服器未能成功啟動') + '</span>';
      }
    }

    function handleOpenLog() {
      if (window.electronAPI && typeof window.electronAPI.openLogDir === 'function') {
        window.electronAPI.openLogDir();
      }
    }
  </script>
</body>
</html>
